<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);

}

.box{

width:350px;

background:#1e293b;

padding:30px;

border-radius:20px;

box-shadow:
0 0 30px
rgba(
0,
0,
0,
.4
);

}

.title{

text-align:center;

font-size:28px;

font-weight:bold;

color:white;

margin-bottom:25px;

}

input{

width:100%;

padding:14px;

border:none;

outline:none;

border-radius:12px;

background:#334155;

color:white;

margin-bottom:15px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

background:#2563eb;

color:white;

cursor:pointer;

}

.err{

margin-top:15px;

text-align:center;

color:#ef4444;

display:none;

}

</style>

</head>

<body>

<div class="box">

<div class="title">
SUBUNLOCK ADMIN
</div>

<input
id="pass"

type="password"

placeholder=
"Nhập mật khẩu">

<button
onclick="login()">

Đăng nhập

</button>

<div
class="err"

id="err">

Sai mật khẩu

</div>

</div>

<script>

function login(){

const pass =
document
.getElementById(
"pass"
).value;

if(
pass ===
"NghialqTV2026"
){

window.location =
"/dashboard";

}else{

document
.getElementById(
"err"
)

.style.display=
"block";

}

}

</script>

</body>

</html>
