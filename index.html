<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Unlock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="title">HOÀN THÀNH NHIỆM VỤ</div>

        <div class="progressBox">
            <div class="progress" id="progress"></div>
        </div>

        <div class="task">
            <h3>1. Đăng ký kênh YouTube</h3>
            <button id="subBtn" onclick="subscribeYoutube()">Đăng ký kênh</button>
        </div>

        <div class="task">
            <h3>2. Like - Bình Luận</h3>
            <button id="likeBtn" onclick="likeVideo()">Like video</button>
        </div>

        <div class="task">
            <h3>3. Tham gia Telegram</h3>
            <button id="teleBtn" onclick="joinTelegram()">Tham gia Telegram</button>
        </div>

        <div class="task">
            <h3>4. Xác minh nhiệm vụ</h3>
            <button class="btn" id="verifyBtn" onclick="verifyTasks()">Xác minh nhiệm vụ</button>
        </div>

        <div id="unlockBox" style="display:none; margin-top:20px;">
            <div class="success">✅ HOÀN THÀNH</div>
            <button class="btn" id="openBtn" style="background: linear-gradient(135deg, #16a34a, #22c55e);" onclick="openUnlock()">MỞ LINK LẤY FILE</button>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
