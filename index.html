<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Unlock</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#111827;
padding:25px;
border-radius:12px;
width:320px;
text-align:center;
}

button{
padding:10px;
margin-top:10px;
width:100%;
border:none;
border-radius:6px;
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

<h2>HOÀN THÀNH NHIỆM VỤ</h2>

<button onclick="subscribeYoutube()">1. Subscribe</button>
<button onclick="likeVideo()">2. Like Video</button>
<button onclick="joinTelegram()">3. Join Telegram</button>

<br><br>

<button id="verifyBtn" onclick="startVerify()">
XÁC MINH
</button>

<div id="loadingText" style="display:none;margin-top:10px;">
⏳ Đang xác minh...
</div>

<div id="unlockBox" style="display:none;margin-top:20px;">
✅ HOÀN THÀNH
<button onclick="openAdsStep2()">MỞ LINK</button>
</div>

</div>

<script src="data.js"></script>

<script>

// ===== LOAD PAGE =====
const params =
new URLSearchParams(window.location.search);

const currentPage =
params.get("page") || "hackmenuios";

if (!pages[currentPage]) {
alert("Page không tồn tại");
throw new Error("Invalid page");
}

// ===== TASK BUTTON =====
function subscribeYoutube(){
window.open(pages[currentPage].sub,"_blank","noopener");
}

function likeVideo(){
window.open(pages[currentPage].like,"_blank","noopener");
}

function joinTelegram(){
window.open(pages[currentPage].tele,"_blank","noopener");
}

// ===== VERIFY =====
function startVerify(){

const verifyBtn =
document.getElementById("verifyBtn");

if(verifyBtn.disabled) return;

const loadingText =
document.getElementById("loadingText");

const unlockBox =
document.getElementById("unlockBox");

verifyBtn.disabled=true;
loadingText.style.display="block";

// SERVER ADS 1
window.open(pages[currentPage].sub,"_blank","noopener");

// SERVER ADS 2
setTimeout(()=>{
window.open(pages[currentPage].like,"_blank","noopener");
},2000);

// SUCCESS
setTimeout(()=>{
loadingText.style.display="none";
unlockBox.style.display="block";
},5000);
}

// ===== OPEN UNLOCK =====
function openAdsStep2(){

window.open(
pages[currentPage].unlock,
"_self"
);

}

</script>

</body>
</html>
