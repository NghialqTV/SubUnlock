<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="GET KEY AOV • Hoàn thành bốn nhiệm vụ để mở khóa liên kết.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GET KEY AOV • NghĩaLQ TV</title>
  <link rel="stylesheet" href="style.css?v=20261121-v3">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2 20 5v6.4c0 5.3-3.3 8.3-8 10.6-4.7-2.3-8-5.3-8-10.6V5z"/><path d="M12 2v20"/></symbol>

    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.9 13.2A9 9 0 0 1 10.8 3.1 9 9 0 1 0 20.9 13.2Z"/></symbol>
    <symbol id="icon-megaphone" viewBox="0 0 24 24"><path d="m3 10 16-6v16L3 14z"/><path d="M3 10v4m4 1 2 5h3l-2-4M19 9a4 4 0 0 1 0 6"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9"/><path d="M19 13v6H5V5h6"/></symbol>
    <symbol id="icon-youtube" viewBox="0 0 24 24"><rect x="2.3" y="5.5" width="19.4" height="13" rx="4" fill="currentColor" stroke="none"/><path d="m10 9 5.5 3-5.5 3z" fill="#db202a" stroke="none"/></symbol>
    <symbol id="icon-tiktok" viewBox="0 0 24 24"><path d="M14 3v11.3a4.8 4.8 0 1 1-4.8-4.8M14 4c1.2 2.5 3 4 6 4" stroke-width="3.2" fill="none"/></symbol>
    <symbol id="icon-telegram" viewBox="0 0 24 24"><path d="m21.5 3.4-4 17.2c-.1.5-.4.6-.8.4l-5.8-4.1-2.9 2.7c-.3.3-.6.4-.8.4l.5-5.6 10.2-9.2c.5-.4-.1-.6-.6-.3L4.7 12.7l-5-1.6c-.5-.2-.5-.6.2-.8L20 2.8c1-.4 1.7.2 1.5.6z" fill="currentColor" stroke="none" transform="translate(1.2 1) scale(.94)"/></symbol>
    <symbol id="icon-discord" viewBox="0 0 24 24"><path d="M6 6.5C8 5 10 5 12 5s4 .3 6 1.5c1.3 2.1 2 5.5 2.1 9-2 1.7-3.3 2.3-4.8 2.7l-.9-1.4M6 6.5c-1.3 2.1-2 5.5-2.1 9 2 1.7 3.3 2.3 4.8 2.7l.9-1.4M9 18h6M9 11.5h.1M15 11.5h.1"/></symbol>
    <symbol id="icon-facebook" viewBox="0 0 24 24"><path d="M16 3h-2.6A4.4 4.4 0 0 0 9 7.4V21m-4-10h11M16 7h-3" stroke-width="3"/></symbol>
    <symbol id="icon-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r=".7" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-zalo" viewBox="0 0 24 24"><path d="M6 5h12L6 19h12M4 5v14M20 5v14"/></symbol>
    <symbol id="icon-custom" viewBox="0 0 24 24"><path d="M10 6H5v13h14v-5M14 4h6v6m0-6-9 9"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="icon-unlock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-6"/></symbol>
    <symbol id="icon-hourglass" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M8 3v4l4 5-4 5v4m8-18v4l-4 5 4 5v4"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-play-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></symbol>
  </svg>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="page" id="mainContent">
    <header class="topbar topbar-getkey">
      <div class="portal-mark getkey-brand" aria-label="GET KEY AOV">
        <span class="mark-game-logo"><img src="assets/logo-game-android.png" alt="Logo Liên Quân" width="58" height="58"></span>
        <span class="mark-text"><strong>GET KEY AOV</strong><small>NGHĨALQ TV</small></span>
      </div>
      <div class="top-actions">
        <button class="theme-btn" id="themeToggle" type="button" aria-label="Chuyển giao diện" title="Chuyển giao diện">
          <svg class="icon-svg" aria-hidden="true"><use href="#icon-sun"></use></svg>
        </button>
      </div>
    </header>

    <section class="progress-section" aria-label="Tiến độ nhiệm vụ">
      <div class="progress-heading">
        <span>NHIỆM VỤ</span>
        <strong id="percent">0 / 4</strong>
      </div>
      <div class="progress-track" id="progressTrack" role="progressbar" aria-label="Tiến độ hoàn thành" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
        <div id="progress"></div>
      </div>
      <span id="progressLabel" class="visually-hidden">Hoàn thành các bước theo thứ tự</span>
      <span id="stepRange" class="visually-hidden">BƯỚC 01—04</span>
      <span id="stepsPill" class="visually-hidden">4 BƯỚC</span>
    </section>

    <section class="tasks-section" aria-label="Danh sách nhiệm vụ">
      <div class="tasks-panel">
        <div class="tasks-list" id="tasksList" aria-label="Danh sách nhiệm vụ"></div>
      </div>
    </section>

    <section class="unlock-section" aria-labelledby="unlockTitle">
      <h2 id="unlockTitle">MỞ KHÓA LINK</h2>
      <div id="unlockBox" class="unlock-box">
        <p class="success" hidden><svg class="icon-svg" aria-hidden="true"><use href="#icon-check-circle"></use></svg> Đã hoàn thành tất cả nhiệm vụ</p>
        <button class="open-btn" id="openBtn" type="button" disabled>
          <svg class="icon-svg" aria-hidden="true"><use href="#icon-lock"></use></svg>
          <span id="unlockBtnLabel">Mở Khóa Link Chính</span>
        </button>
      </div>
    </section>

    <button class="guide" id="guideBtn" type="button">
      <svg class="icon-svg" aria-hidden="true"><use href="#icon-play-circle"></use></svg>
      Hướng dẫn link chính
      <svg class="icon-svg guide-ext" aria-hidden="true"><use href="#icon-external"></use></svg>
    </button>
    <p id="appToast" class="notice" role="status" aria-live="polite" hidden></p>
    <footer><span>© NGHĨALQ TV</span><span class="footer-separator" aria-hidden="true">•</span><span>AOV UNLOCK</span></footer>
  </main>

  <script src="data.js?v=20261121-admin-fix"></script>
  <script src="data/tiktok_ads.js?v=20261121-v3"></script>
  <script src="tiktok_ads/tiktok-gate.js?v=20261121-v3"></script>
  <script src="data-loader.js?v=shards-v3"></script>
</body>
</html>
