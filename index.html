<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c100d">
<title>SubToUnlock • NghĩaLQ TV</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="theme-btn" onclick="toggleTheme()" aria-label="Đổi giao diện">
      <i class="fa-solid fa-sun"></i>
    </div>

    <div class="time-pill">
      <i class="fa-regular fa-clock"></i>
      <span id="clock">12:49 AM</span>
    </div>

    <div class="brand-row">
      <div class="brand-logo glow">
        <img src="assets/logo-game-android.png" alt="Game Android">
      </div>

      <div class="title-wrap">
        <h1>SUBRIECE YOUTUBE</h1>
        <div class="brand-name">NGHĨALQ TV</div>
      </div>

      <div class="brand-logo glow">
        <img src="assets/logo-android.png" alt="Android">
      </div>
    </div>
  </section>

  <section class="tasks-section">
    <div class="section-title">Nhiệm vụ cần hoàn thành</div>

    <button class="task" id="task1" onclick="subscribeYoutube()">
      <span class="task-icon youtube"><i class="fa-brands fa-youtube"></i></span>
      <span class="task-text">
        <strong>Đăng ký kênh NghĩaLQ TV</strong>
        <small>Nhấn để đăng ký kênh YouTube</small>
      </span>
      <span class="task-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </button>

    <button class="task" id="task2" onclick="subscribeCyber()">
      <span class="task-icon youtube"><i class="fa-brands fa-youtube"></i></span>
      <span class="task-text">
        <strong>Đăng ký kênh Cyber Mods</strong>
        <small>Nhấn để đăng ký kênh YouTube</small>
      </span>
      <span class="task-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </button>

    <button class="task" id="task3" onclick="likeVideo()">
      <span class="task-icon like"><i class="fa-solid fa-thumbs-up"></i></span>
      <span class="task-text">
        <strong>Like Video</strong>
        <small>Mở video và bấm Like</small>
      </span>
      <span class="task-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </button>

    <button class="task" id="task4" onclick="joinTelegram()">
      <span class="task-icon telegram"><i class="fa-brands fa-telegram"></i></span>
      <span class="task-text">
        <strong>Tham gia nhóm Telegram</strong>
        <small>Nhấn để tham gia nhóm</small>
      </span>
      <span class="task-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </button>
  </section>

  <section class="unlock-card">
    <div class="status-line">
      <span>Trạng thái mở khóa</span>
      <b id="percent">0 / 4</b>
    </div>

    <div class="progress-track">
      <div id="progress"></div>
    </div>

    <button class="step-confirm-btn" id="stepConfirm" onclick="confirmPending()" style="display:none"></button>

    <button class="verify-btn" id="verifyBtn" onclick="verifyTasks()">
      <i class="fa-solid fa-lock"></i>
      <span>Mở Khoá</span>
    </button>

    <div id="unlockBox" class="unlock-box">
      <div class="success"><i class="fa-solid fa-circle-check"></i> Đã hoàn thành tất cả nhiệm vụ</div>
      <button class="open-btn" id="openBtn" onclick="openUnlock()">Đã Mở Khoá</button>
    </div>
  </section>

  <button class="guide" onclick="openGuide()">
    <i class="fa-solid fa-circle-play"></i>
    Hướng dẫn Vượt Link
  </button>

  <footer>NghĩaLQ TV • AOV UNLOCK</footer>
</main>

<script src="data.js"></script>
<script src="data/tiktok_ads.js?v=20260830"></script>
<script src="tiktok_ads/tiktok-gate.js?v=20260830"></script>
<script src="app.js?v=20260830-2mfix"></script>
</body>
</html>
