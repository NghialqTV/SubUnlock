<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Task Unlock</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="title">
HOÀN THÀNH NHIỆM VỤ
</div>

<div class="progressBox">
<div class="progress" id="progress"></div>
</div>

<!-- SUBSCRIBE -->

<div class="task">

<h3>
1. Đăng ký kênh YouTube
</h3>

<button onclick="subscribeYoutube()">
Subscribe
</button>

</div>

<!-- LIKE -->

<div class="task">

<h3>
2. Like video YouTube
</h3>

<button onclick="likeVideo()">
Like Video
</button>

</div>

<!-- TELEGRAM -->

<div class="task">

<h3>
3. Tham gia Telegram
</h3>

<button onclick="joinTelegram()">
Join Telegram
</button>

</div>

<!-- VERIFY -->

<div class="task">

<h3>
4. Xác minh nhiệm vụ
</h3>

<button
class="btn"
id="verifyBtn"
onclick="startVerify()">

Thực hiện

</button>

<div
id="loadingText"
style="display:none; margin-top:10px;">

⏳ Đang xác minh nhiệm vụ...

</div>

</div>

<!-- SUCCESS -->

<div
id="unlockBox"
style="display:none; margin-top:20px;">

<div class="success">
✅ HOÀN THÀNH
</div>

<button
class="btn"
id="openBtn"
onclick="openAdsStep2()">

MỞ LINK

</button>

</div>

</div>

</div>

<!-- DATA -->

<script src="data.js"></script>

<script>

// lấy page hiện tại
const params =
new URLSearchParams(window.location.search);

const currentPage =
params.get("page") || "hackmenuios";


// kiểm tra page tồn tại
if (!pages[currentPage]) {
  alert("Page không tồn tại");
  throw new Error("Invalid page");
}

// SUBSCRIBE
function subscribeYoutube() {

  window.open(
    pages[currentPage].sub,
    "_blank"
  );

}


// LIKE VIDEO
function likeVideo() {

  window.open(
    pages[currentPage].like,
    "_blank"
  );

}


// JOIN TELEGRAM
function joinTelegram() {

  window.open(
    pages[currentPage].tele,
    "_blank"
  );

}


// VERIFY
function startVerify() {

  const verifyBtn =
  document.getElementById("verifyBtn");

  verifyBtn.disabled = true;

  document.getElementById(
    "loadingText"
  ).style.display = "block";

  // quảng cáo 1
  window.open(
    "https://vt.tiktok.com/ZS9YR7qcbCb1Y-ngGkg/",
    "_blank"
  );

  // loading
  setTimeout(() => {

    document.getElementById(
      "loadingText"
    ).style.display = "none";

    document.getElementById(
      "unlockBox"
    ).style.display = "block";

  }, 5000);

}


// ADS STEP 2
function openAdsStep2() {

  const openBtn =
  document.getElementById("openBtn");

  openBtn.disabled = true;

  // quảng cáo 2
  window.open(
    "https://vt.tiktok.com/ZS9YRTCTBKE3B-Pnxqj/",
    "_blank"
  );

  // đợi rồi mở unlock
  setTimeout(() => {

    window.location.href =
    pages[currentPage].unlock;

  }, 5000);

}

</script>

</body>
</html>
