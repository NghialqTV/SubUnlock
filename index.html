<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Task Unlock</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="title">
HOÀN THÀNH NHIỆM VỤ
</div>

<div class="progressBox">
<div class="progress" id="progress"></div>
</div>

<!-- SUBSCRIBE -->

<div class="task">

<h3>
1. Đăng ký kênh YouTube
</h3>

<button onclick="subscribeYoutube()">
Subscribe
</button>

</div>

<!-- LIKE -->

<div class="task">

<h3>
2. Like video YouTube
</h3>

<button onclick="likeVideo()">
Like Video
</button>

</div>

<!-- TELEGRAM -->

<div class="task">

<h3>
3. Tham gia Telegram
</h3>

<button onclick="joinTelegram()">
Join Telegram
</button>

</div>

<!-- VERIFY -->

<!-- STEP 4 -->

<div class="task">

  <span>Bước 4 - Xác Minh Nhiệm Vụ</span>

  <!-- nút bước 1 -->
  <button class="btn" id="verifyBtn" onclick="startVerify()">
    Thực hiện
  </button>

  <!-- loading -->
  <div id="loadingText" style="display:none; margin-top:10px;">
    ⏳ Đang xác minh nhiệm vụ...
  </div>

</div>

<!-- hoàn thành -->

<div id="unlockBox" style="display:none; margin-top:20px;">

  <div class="success">
    ✅ HOÀN THÀNH
  </div>

  <!-- nút mở link -->
  <button class="btn" id="openBtn" onclick="openAdsStep2()">
    MỞ LINK
  </button>

</div>

<script>

// bước 1
function startVerify() {

  // khóa nút
  document.getElementById("verifyBtn").disabled = true;

  // hiện loading
  document.getElementById("loadingText").style.display = "block";

  // quảng cáo đầu
  window.open(
    "https://vt.tiktok.com/ZS9YR7qcbCb1Y-ngGkg/",
    "_blank"
  );

  // sau 5 giây hiện hoàn thành
  setTimeout(() => {

    document.getElementById("loadingText").style.display = "none";

    document.getElementById("unlockBox").style.display = "block";

  }, 5000);
}


// bước 2 khi bấm mở link
function openAdsStep2() {

  // khóa nút
  document.getElementById("openBtn").disabled = true;

  // quảng cáo thứ 2
  window.open(
    "https://vt.tiktok.com/ZS9YRTCTBKE3B-Pnxqj/",
    "_blank"
  );

  // đợi quay lại rồi mở link gốc
  setTimeout(() => {

    window.open(
      "LINK_GOC_CUA_BAN",
      "_blank"
    );

  }, 5000);

}

</script>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
