<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Task Unlock</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="title">
HOÀN THÀNH NHIỆM VỤ
</div>

<div class="progressBox">
<div class="progress" id="progress"></div>
</div>

<!-- SUBSCRIBE -->

<div class="task">

<h3>
1. Đăng ký kênh YouTube
</h3>

<button onclick="subscribeYoutube()">
Subscribe
</button>

</div>

<!-- LIKE -->

<div class="task">

<h3>
2. Like video YouTube
</h3>

<button onclick="likeVideo()">
Like Video
</button>

</div>

<!-- TELEGRAM -->

<div class="task">

<h3>
3. Tham gia Telegram
</h3>

<button onclick="joinTelegram()">
Join Telegram
</button>

</div>

<!-- VERIFY -->

<div class="task">

  <span>Bước 4 - Xác Minh Nhiệm Vụ</span>

  <button class="btn" id="verifyBtn" onclick="startVerify()">
    Thực hiện
  </button>

  <div id="loadingText" style="display:none; margin-top:10px;">
    ⏳ Đang xác minh nhiệm vụ...
  </div>

</div>

<!-- SUCCESS -->

<div id="unlockBox" style="display:none;">

  <div class="success">
    ✅ HOÀN THÀNH
  </div>

  <button class="btn" onclick="openUnlock()">
    MỞ LINK
  </button>

</div>

</div>

</div>

<script>

function startVerify() {

  // khóa nút tránh spam
  document.getElementById("verifyBtn").disabled = true;

  // quảng cáo 1
  window.open(
    "https://vt.tiktok.com/ZS9YR7qcbCb1Y-ngGkg/",
    "_blank"
  );

  // quảng cáo 2
  setTimeout(() => {

    window.open(
      "https://vt.tiktok.com/ZS9YRTCTBKE3B-Pnxqj/",
      "_blank"
    );

  }, 1500);

  // hiện loading
  document.getElementById("loadingText").style.display = "block";

  // unlock sau 5 giây
  setTimeout(() => {

    document.getElementById("loadingText").style.display = "none";

    document.getElementById("unlockBox").style.display = "block";

  }, 5000);

}

</script>
