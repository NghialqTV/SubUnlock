<!DOCTYPE html>
<html lang="vi">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Task Unlock</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="bg"></div>

<div class="container">

  <div class="top-box">

    <div class="logo">
      🔓
    </div>

    <h1>
      HOÀN THÀNH NHIỆM VỤ
    </h1>

    <p>
      Thực hiện đầy đủ nhiệm vụ để mở khóa liên kết tải xuống.
    </p>

    <div class="progress-area">

      <div class="progress-bar">
        <div id="progress"></div>
      </div>

      <span id="percent">0%</span>

    </div>

  </div>


  <div class="task-card">

    <div class="task-left">
      <div class="icon red">
        ▶
      </div>

      <div>
        <h2>Đăng ký kênh</h2>
        <p>YouTube Subscribe</p>
      </div>
    </div>

    <button onclick="subscribeYoutube()">
      Subscribe
    </button>

  </div>


  <div class="task-card">

    <div class="task-left">
      <div class="icon blue">
        👍
      </div>

      <div>
        <h2>Like Video</h2>
        <p>Thả tim video YouTube</p>
      </div>
    </div>

    <button onclick="likeVideo()">
      Like Video
    </button>

  </div>


  <div class="task-card">

    <div class="task-left">
      <div class="icon sky">
        ✈
      </div>

      <div>
        <h2>Telegram</h2>
        <p>Tham gia nhóm Telegram</p>
      </div>
    </div>

    <button onclick="joinTelegram()">
      Join Group
    </button>

  </div>


  <div class="verify-box">

    <button
    class="verify-btn"
    id="verifyBtn"
    onclick="verifyTasks()">

      Xác Minh Nhiệm Vụ

    </button>

  </div>


  <div class="unlock-box"
  id="unlockBox">

    <h2>
      🎉 Hoàn thành nhiệm vụ
    </h2>

    <p>
      Nhấn nút bên dưới để mở khóa liên kết.
    </p>

    <button
    class="unlock-btn"
    onclick="openUnlock()">

      MỞ KHÓA LINK

    </button>

  </div>


  <div class="footer">
    Powered by NghiaLQTV
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
