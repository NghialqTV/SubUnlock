<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Unlock</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Thêm hiệu ứng cho nút khi đã hoàn thành */
        button.completed {
            background-color: #28a745 !important; /* Đổi sang màu xanh lá */
            color: #fff !important;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Unlock</title><link rel="stylesheet" href="style.css"><style>
button.completed{
    background:linear-gradient(
        135deg,
        #16a34a,
        #22c55e
    ) !important;
}
</style></head>
<body><div class="container"><div class="card">

    <div class="title">
        HOÀN THÀNH NHIỆM VỤ
    </div>

    <div class="progressBox">
        <div class="progress" id="progress"></div>
    </div>

    <div style="text-align:center;margin-bottom:15px;">
        <span id="percent">0%</span>
    </div>

    <div class="task">
        <h3>1. Đăng ký kênh YouTube</h3>

        <button id="btnSub"
            onclick="subscribeYoutube()">
            Subscribe
        </button>
    </div>

    <div class="task">
        <h3>2. Like video YouTube</h3>

        <button id="btnLike"
            onclick="likeVideo()">
            Like Video
        </button>
    </div>

    <div class="task">
        <h3>3. Tham gia Telegram</h3>

        <button id="btnTele"
            onclick="joinTelegram()">
            Join Telegram
        </button>
    </div>

    <div class="task">

        <h3>4. Xác minh nhiệm vụ</h3>

        <button
            class="btn"
            id="verifyBtn"
            onclick="startVerify()">

            Thực hiện

        </button>

        <div
            id="loadingText"
            style="display:none;margin-top:10px;">

            ⏳ Đang xác minh nhiệm vụ...

        </div>

    </div>

    <div
        id="unlockBox"
        style="display:none;margin-top:20px;">

        <div class="success">
            ✅ HOÀN THÀNH
        </div>

        <button
            class="btn"
            id="openBtn"
            onclick="openAdsStep2()">

            MỞ LINK

        </button>

    </div>

</div>

</div><script src="data.js"></script><script>

const params =
    new URLSearchParams(window.location.search);

const currentPage =
    params.get("id");

if(!pages[currentPage]){

    document.body.innerHTML = `
        <div style="
            color:white;
            text-align:center;
            padding:40px;
        ">
            <h2>❌ Page không tồn tại</h2>
        </div>
    `;

    throw new Error("Page không tồn tại");
}

let step1_done = false;
let step2_done = false;
let step3_done = false;

function updateProgress(){

    let done = 0;

    if(step1_done) done++;
    if(step2_done) done++;
    if(step3_done) done++;

    const percent =
        Math.floor((done / 3) * 100);

    document.getElementById("progress")
        .style.width = percent + "%";

    document.getElementById("percent")
        .innerText = percent + "%";
}

function markAsCompleted(buttonId,text){

    const btn =
        document.getElementById(buttonId);

    btn.classList.add("completed");

    btn.innerText = text + " ✓";

    updateProgress();
}

function subscribeYoutube(){

    window.open(
        pages[currentPage].sub,
        "_blank"
    );

    step1_done = true;

    markAsCompleted(
        "btnSub",
        "Subscribe"
    );
}

function likeVideo(){

    if(!step1_done){

        alert(
            "Vui lòng hoàn thành Bước 1 trước!"
        );

        return;
    }

    window.open(
        pages[currentPage].like,
        "_blank"
    );

    step2_done = true;

    markAsCompleted(
        "btnLike",
        "Like Video"
    );
}

function joinTelegram(){

    if(!step2_done){

        alert(
            "Vui lòng hoàn thành Bước 2 trước!"
        );

        return;
    }

    window.open(
        pages[currentPage].tele,
        "_blank"
    );

    step3_done = true;

    markAsCompleted(
        "btnTele",
        "Join Telegram"
    );
}

function startVerify(){

    if(
        !step1_done ||
        !step2_done ||
        !step3_done
    ){

        alert(
            "Bạn phải hoàn thành tất cả nhiệm vụ trước!"
        );

        return;
    }

    const verifyBtn =
        document.getElementById("verifyBtn");

    verifyBtn.disabled = true;

    document.getElementById(
        "loadingText"
    ).style.display = "block";

    window.open(
        "https://vt.tiktok.com/ZS9YR7qcbCb1Y-ngGkg/",
        "_blank"
    );

    setTimeout(() => {

        document.getElementById(
            "loadingText"
        ).style.display = "none";

        document.getElementById(
            "unlockBox"
        ).style.display = "block";

        markAsCompleted(
            "verifyBtn",
            "Đã xác minh"
        );

    },5000);
}

function openAdsStep2(){

    const openBtn =
        document.getElementById("openBtn");

    openBtn.disabled = true;

    window.open(
        "https://vt.tiktok.com/ZS9YRTCTBKE3B-Pnxqj/",
        "_blank"
    );

    setTimeout(() => {

        window.location.href =
            pages[currentPage].unlock;

    },5000);
}

</script></body>
</html>
</div>

<script src="data.js"></script>

<script>
// Lấy page hiện tại
const params = new URLSearchParams(window.location.search);
const currentPage = params.get("id");

// Kiểm tra page tồn tại
if (!pages[currentPage]) {
    alert("Page không tồn tại");
}

// Biến kiểm tra trạng thái từng bước
let step1_done = false;
let step2_done = false;
let step3_done = false;

// Hàm cập nhật giao diện nút khi hoàn thành
function markAsCompleted(buttonId, text) {
    const btn = document.getElementById(buttonId);
    btn.classList.add("completed");
    btn.innerText = text + " (Đã làm)";
}

// SUBSCRIBE - BƯỚC 1
function subscribeYoutube() {
    window.open(pages[currentPage].sub, "_blank");
    step1_done = true;
    markAsCompleted("btnSub", "Subscribe");
}

// LIKE VIDEO - BƯỚC 2
function likeVideo() {
    if (!step1_done) {
        alert("Vui lòng hoàn thành Bước 1: Đăng ký kênh trước!");
        return;
    }
    window.open(pages[currentPage].like, "_blank");
    step2_done = true;
    markAsCompleted("btnLike", "Like Video");
}

// JOIN TELEGRAM - BƯỚC 3
function joinTelegram() {
    if (!step2_done) {
        alert("Vui lòng hoàn thành Bước 2: Like video trước!");
        return;
    }
    window.open(pages[currentPage].tele, "_blank");
    step3_done = true;
    markAsCompleted("btnTele", "Join Telegram");
}

// VERIFY - BƯỚC 4
function startVerify() {
    // Kiểm tra xem đã làm đủ 3 bước chưa
    if (!step1_done || !step2_done || !step3_done) {
        alert("Bạn phải hoàn thành tất cả các bước 1, 2, 3 trước khi xác minh!");
        return;
    }

    const verifyBtn = document.getElementById("verifyBtn");
    verifyBtn.disabled = true;
    document.getElementById("loadingText").style.display = "block";

    // Quảng cáo 1
    window.open("https://vt.tiktok.com/ZS9YR7qcbCb1Y-ngGkg/", "_blank");

    // Loading 5 giây
    setTimeout(() => {
        document.getElementById("loadingText").style.display = "none";
        document.getElementById("unlockBox").style.display = "block";
        markAsCompleted("verifyBtn", "Thực hiện");
    }, 5000);
}

// ADS STEP 2
function openAdsStep2() {
    const openBtn = document.getElementById("openBtn");
    openBtn.disabled = true;

    // Quảng cáo 2
    window.open("https://vt.tiktok.com/ZS9YRTCTBKE3B-Pnxqj/", "_blank");

    // Đợi 5 giây rồi mở link unlock
    setTimeout(() => {
        window.location.href = pages[currentPage].unlock;
    }, 5000);
}
</script>

</body>
</html>
